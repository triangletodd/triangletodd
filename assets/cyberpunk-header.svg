    <linearGradient id="laptop-fill" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132e4a"/><stop offset=".65" stop-color="#0b1730"/><stop offset="1" stop-color="#271437"/></linearGradient>
    <linearGradient id="hacker-neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24f7f6"/><stop offset=".56" stop-color="#7b79fa"/><stop offset="1" stop-color="#f85cbd"/></linearGradient>
    <radialGradient id="hacker-halo"><stop stop-color="#137f99" stop-opacity=".22"/><stop offset=".7" stop-color="#5f2a92" stop-opacity=".07"/><stop offset="1" stop-color="#5f2a92" stop-opacity="0"/></radialGradient>
