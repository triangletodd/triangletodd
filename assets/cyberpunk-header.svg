    <linearGradient id="tower" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#1a2d44"/><stop offset="1" stop-color="#080b16"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#49d9f7" stroke-width=".65" opacity=".11"/></pattern>
