<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">triangletodd — cyberpunk GitHub profile banner</title>
  <desc id="desc">Compact dark cyberpunk profile header featuring a hooded developer on the left, triangletodd and Todd Edwards branding in the center, and a neon Raleigh skyline on the right.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b14"/><stop offset=".60" stop-color="#0a1021"/><stop offset="1" stop-color="#180e28"/></linearGradient>
    <linearGradient id="title-grad" x1="0" x2="1"><stop stop-color="#7ff9ff"/><stop offset=".48" stop-color="#00dcea"/><stop offset="1" stop-color="#bf83ff"/></linearGradient>
